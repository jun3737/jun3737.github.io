<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #ebedf2; /* 사진 속의 부드러운 연그레이 배경색 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 흰색 안내 카드 */
    .close-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px; /* 원본 화면의 아담하고 세로로 묵직한 카드 비율 */
      border-radius: 24px;
      padding: 48px 24px 36px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); /* 은은하고 부드러운 그림자 */
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 */
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #1e3a8a; /* 짙은 네이비 블루 계열 */
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주문접수가 마감되었습니다 주요 메시지 */
    .main-message {
      font-size: 22px;
      font-weight: 900;
      color: #1e3a8a;
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8; /* 연한 회색 톤 */
      line-height: 1.6;
      margin-bottom: 32px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #f1f5f9;
      margin-bottom: 24px;
    }

    /* 환불 신청 버튼 */
    .btn-refund {
      width: 100%;
      background-color: #fff1f2; /* 아주 연한 핑크/레드빛 배경 */
      border: 1px solid #ffe4e6; /* 살짝 더 진한 핑크 테두리 */
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #e11d48; /* 선명한 레드 컬러 텍스트 */
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #ffe4e6;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <!-- 중앙 마감 안내 카드 영역 -->
  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
