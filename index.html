<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #e5e0d8; /* 차분하고 따뜻한 느낌의 밀크티 베이지 배경 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (눈부심을 덜어주는 소프트 크림 아이보리) */
    .close-card {
      background-color: #fcfbfa; 
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 48px 24px 36px 24px;
      box-shadow: 0 10px 30px rgba(139, 130, 115, 0.12); /* 따뜻한 톤의 부드러운 그림자 */
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 (포근한 딥 브라운) */
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #4a3b32;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 */
    .main-message {
      font-size: 22px;
      font-weight: 900;
      color: #2b2420; /* 쨍한 블랙 대신 눈이 편안한 다크 브라운 */
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #8c827a; /* 본문과 어우러지는 웜 그레이 */
      line-height: 1.6;
      margin-bottom: 32px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #f0ede9;
      margin-bottom: 24px;
    }

    /* 환불 신청 버튼 (차분하고 이쁜 인디핑크 & 코랄 브라운 조화) */
    .btn-refund {
      width: 100%;
      background-color: #f7edea; /* 아늑한 톤의 연한 인디핑크 베이스 */
      border: 1px solid #ebdcd7; 
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #bc6c58; /* 튀지 않으면서 조화로운 로즈 브라운 */
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #ebdcd7;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
