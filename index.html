<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #e2e5ec; /* 원본의 연그레이 배경에서 채도와 밝기를 차분하게 조절 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (쨍한 백색을 피해 눈부심을 방지한 부드러운 미색) */
    .close-card {
      background-color: #f8f9fa; 
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 48px 24px 36px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 (원본 블루에서 채도를 낮춘 차분한 데님 네이비) */
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #3b4b6b;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 */
    .main-message {
      font-size: 22px;
      font-weight: 900;
      color: #2e3b54; /* 채도를 낮춰 대비를 부드럽게 만든 메인 블루 */
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #8a94a6; /* 자극적이지 않은 차분한 그레이 */
      line-height: 1.6;
      margin-bottom: 32px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #edf0f5;
      margin-bottom: 24px;
    }

    /* 환불 신청 버튼 (원본의 핑크/레드 톤에서 채도를 쏙 뺀 편안한 컬러) */
    .btn-refund {
      width: 100%;
      background-color: #f9ebeb; /* 채도가 낮고 부드러운 연핑크 */
      border: 1px solid #ebd7d7; 
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #ba5353; /* 쨍한 레드가 아닌 차분하게 가라앉은 톤다운 로즈레드 */
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #ebd7d7;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
