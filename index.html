<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰 - 교환/반품 접수 완료</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #3B5BDB;
      --text: #1a1a2e;
      --sub: #6b7280;
      --bg: #edeae4;
      --white: #ffffff;
      --red: #e53935;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      letter-spacing: -0.5px;
      margin-top: 20px;
    }

    .sub-title {
      font-size: 13px;
      color: var(--sub);
      text-align: center;
      margin-bottom: 10px;
    }

    /* 상단 체크 완료 카드 */
    .status-card {
      background: var(--white);
      border-radius: 20px;
      padding: 32px 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .check-icon {
      width: 60px;
      height: 60px;
      background-color: #eef2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--blue);
      margin-bottom: 4px;
    }

    .status-msg {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    /* 하단 안내 사항 카드 */
    .notice-card {
      background: var(--white);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .notice-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }

    .notice-list {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notice-list li {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.6;
      font-weight: 600;
    }

    .notice-list li span {
      color: var(--red);
      font-weight: 700;
    }

    /* 노란색 경고 박스 */
    .warning-box {
      background: #fffbe6;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      border: 1px solid #ffe066;
    }

    .warning-box p {
      font-size: 12px;
      color: #7a5c00;
      line-height: 1.8;
      font-weight: 500;
    }

    /* 처음으로 버튼 */
    .btn-home {
      width: 100%;
      background: var(--blue);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(59, 91, 219, 0.2);
      transition: background 0.15s;
    }

    .btn-home:active {
      background: #2f4bbf;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div>
      <h1 class="title">교환/반품 접수</h1>
      <p class="sub-title">주문 정보를 확인하고 교환 또는 반품을 직접 접수할 수 있습니다.</p>
    </div>

    <div class="status-card">
      <div class="check-icon">✓</div>
      <div class="status-msg">접수가 완료되었습니다.</div>
    </div>

    <div class="notice-card">
      <div class="notice-title">교환/반품 절차 안내</div>
      <ol class="notice-list">
        <li>해당 상품을 신청합니다.</li>
        <li>배송비를 입금합니다. <span>(*선입금되어야 접수됩니다)</span></li>
        <li>상품회수.</li>
        <li>검수 후 교환/반품 처리완료!</li>
      </ol>
      
      <div class="warning-box">
        <p>** 방송시간 중에는 교환/반품 상담이 어렵습니다. 접수순으로 연락드립니다. 조금만 기다려주시면 감사하겠습니다!</p>
        <p style="margin-top: 8px;">** 교환과 반품시에는 택과 폴리백은 받으신 그대로 보내주셔야 검수가 가능합니다.</p>
      </div>
    </div>

    <button class="btn-home" onclick="location.href='#'">처음으로</button>

  </div>

</body>
</html>
