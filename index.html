<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #EDEAE4; /* 요청하신 따뜻하고 아늑한 배경색 고정 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (image_3d5c80.png 특유의 가로/세로 황금 비율 반영) */
    .close-card {
      background-color: #ffffff; 
      width: 100%;
      max-width: 390px; /* 카드가 너무 길어 보이지 않도록 가로 폭을 넓히고 안정감 있게 조정 */
      border-radius: 24px;
      padding: 50px 36px 40px 36px; /* 좌우 여백을 넓혀 버튼이 양옆으로 꽉 차게 배치 */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04); /* 과하지 않은 은은한 그림자 */
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 (두 번째 사진의 선명한 블루) */
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #004ba0; 
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 (두 번째 사진 특유의 볼드함과 줄바꿈 비율) */
    .main-message {
      font-size: 24px;
      font-weight: 900;
      color: #004ba0; 
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 (과하지 않고 정갈한 폰트 크기) */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8; 
      line-height: 1.5;
      margin-bottom: 32px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #f1f5f9;
      margin-bottom: 28px;
    }

    /* 환불 신청 버튼 */
    .btn-refund {
      width: 100%; /* 양옆 여백에 맞춰 시원하게 꽉 차는 버튼 라인 */
      background-color: #fff1f2; /* 화사하고 부드러운 연핑크 배경 */
      border: 1px solid #ffe4e6; 
      border-radius: 14px;
      padding: 15px;
      font-size: 14px;
      font-weight: 800;
      color: #df223a; /* 눈이 아프지 않으면서 원본 느낌을 선명하게 살린 레드 */
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #ffe4e6;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
