<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #EDEAE4;          /* 따뜻하고 아늑한 배경색 */
      --main-text: #1A3A5C;         /* 주 텍스트 색 */
      --sub-text: #6B7280;          /* 보조 텍스트 색 */
      --refund-text: #C84142;       /* 환불신청 텍스트 색 */
      --refund-bg: #FFF1F2;         /* 환불신청 배경 색 */
      --refund-border: #FECDD3;     /* 환불신청 테두리 색 */
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 */
    .close-card {
      background-color: #ffffff; 
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 56px 36px 44px 36px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.04);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 */
    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--main-text);
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 */
    .main-message {
      font-size: 26px;
      font-weight: 900;
      color: var(--main-text);
      line-height: 1.45;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 */
    .sub-message {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--sub-text);
      line-height: 1.6;
      margin-bottom: 36px;
      letter-spacing: -0.3px;
    }

    /* 중간 구분선 (더 명확하고 깔끔하게 톤 조절) */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #E5E7EB; /* 구분이 뚜렷해지도록 세련된 그레이 톤업 */
      margin-bottom: 32px;
    }

    /* 환불 신청 버튼 (플로팅 애니메이션 추가) */
    .btn-refund {
      width: 100%;
      background-color: var(--refund-bg);
      border: 1px solid var(--refund-border);
      border-radius: 14px;
      padding: 16px;
      font-size: 15.5px;
      font-weight: 800;
      color: var(--refund-text);
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      letter-spacing: -0.2px;
      
      /* 움직임이 부드럽도록 transition 설정 */
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                  box-shadow 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                  background-color 0.15s;
    }

    /* 마우스 커서를 올렸을 때 (Hover 플로팅 효과) */
    .btn-refund:hover {
      transform: translateY(-4px); /* 위로 4px 살짝 띄우기 */
      box-shadow: 0 6px 16px rgba(200, 65, 66, 0.15); /* 버튼 색상에 맞춘 은은한 핑크빛 섀도우 */
    }

    /* 버튼을 클릭했을 때 (Active 꾹 누르는 효과) */
    .btn-refund:active {
      transform: translateY(-1px); /* 살짝 가라앉기 */
      background-color: var(--refund-border);
      box-shadow: 0 2px 6px rgba(200, 65, 66, 0.1);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 명확해진 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
