<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #cbd2db; /* 배경 밝기를 한 단계 낮춰 눈을 편안하게 조절 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (눈부심 방지를 위해 미색/연회색 톤으로 다운) */
    .close-card {
      background-color: #f4f5f7; 
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 48px 24px 36px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 */
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 */
    .main-message {
      font-size: 22px;
      font-weight: 900;
      color: #1e3a8a;
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 (대비가 너무 강하지 않게 차분한 회색 처리) */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #64748b; 
      line-height: 1.6;
      margin-bottom: 32px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #e2e8f0;
      margin-bottom: 24px;
    }

    /* 환불 신청 버튼 (마찬가지로 톤을 살짝 다운시킨 차분한 핑크레드) */
    .btn-refund {
      width: 100%;
      background-color: #ffe4e6; 
      border: 1px solid #fecdd3; 
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #be123c; 
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #fecdd3;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
