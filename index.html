<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #EDEAE4;          /* 따뜻하고 아늑한 배경색 */
      --main-text: #1A3A5C;         /* 요청하신 주 텍스트 색 */
      --sub-text: #6B7280;          /* 요청하신 보조 텍스트 색 */
      --refund-text: #C84142;       /* 요청하신 환불신청 텍스트 색 */
      --refund-bg: #FFF1F2;         /* 요청하신 환불신청 배경 색 */
      --refund-border: #FECDD3;     /* 요청하신 환불신청 테두리 색 */
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (두 번째 사진의 안정적인 핏과 패딩 조절) */
    .close-card {
      background-color: #ffffff; 
      width: 100%;
      max-width: 400px; /* 글자 크기가 커짐에 따라 가로 폭을 살짝 더 넓혀 밸런스 유지 */
      border-radius: 24px;
      padding: 56px 36px 44px 36px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.04);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 (크기 업그레이드) */
    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--main-text);
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 (시원하고 볼드하게 크기 업그레이드) */
    .main-message {
      font-size: 26px;
      font-weight: 900;
      color: var(--main-text);
      line-height: 1.45;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 (가독성을 위해 14px로 업그레이드) */
    .sub-message {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--sub-text);
      line-height: 1.6;
      margin-bottom: 36px;
      letter-spacing: -0.3px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #f1f5f9;
      margin-bottom: 32px;
    }

    /* 환불 신청 버튼 (지정 색상 100% 반영 및 텍스트 스케일 업) */
    .btn-refund {
      width: 100%;
      background-color: var(--refund-bg);
      border: 1px solid var(--refund-border);
      border-radius: 14px;
      padding: 16px; /* 버튼의 터치 영역과 안정감을 위해 패딩 소폭 확대 */
      font-size: 15.5px;
      font-weight: 800;
      color: var(--refund-text);
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      letter-spacing: -0.2px;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: var(--refund-border);
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
