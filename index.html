<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>땡큐몰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      /* 차가운 회색을 빼고 포근한 온기를 한 스푼 넣은 따뜻한 배경색 */
      background-color: #e9ebee; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 중앙 안내 카드 (원본의 깨끗하고 선명한 화이트 유지) */
    .close-card {
      background-color: #ffffff; 
      width: 100%;
      max-width: 375px;
      border-radius: 24px;
      padding: 54px 24px 40px 24px;
      /* 따뜻해진 배경에 맞춰 부드럽게 퍼지는 은은한 그림자 */
      box-shadow: 0 12px 36px rgba(165, 173, 186, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 땡큐몰 상단 타이틀 (원본의 선명한 블루) */
    .brand-name {
      font-size: 15px;
      font-weight: 800;
      color: #0f4c81; 
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* 주요 메시지 (원본의 또렷하고 선명한 메인 블루) */
    .main-message {
      font-size: 23px;
      font-weight: 900;
      color: #0f4c81; 
      line-height: 1.45;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 하단 보조 설명 문구 */
    .sub-message {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8; 
      line-height: 1.6;
      margin-bottom: 36px;
      letter-spacing: -0.2px;
    }

    /* 중간 구분선 */
    .divider {
      width: 100%;
      height: 1px;
      background-color: #f1f5f9;
      margin-bottom: 28px;
    }

    /* 환불 신청 버튼 */
    .btn-refund {
      width: 100%;
      background-color: #fff1f2; /* 원본 특유의 은은하고 화사한 연핑크 베이스 */
      border: 1px solid #ffe4e6; 
      border-radius: 14px;
      padding: 15px;
      font-size: 14px;
      font-weight: 800;
      /* 너무 쨍해서 눈 아픈 빨강 대신, 부드러우면서도 존재감 있는 크림슨 레드 */
      color: #c92a2a; 
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-refund:active {
      background-color: #ffe4e6;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="close-card">
    <!-- 브랜드명 -->
    <div class="brand-name">땡큐몰</div>
    
    <!-- 메인 마감 안내 -->
    <div class="main-message">
      주문접수가<br>마감되었습니다
    </div>
    
    <!-- 서브 안내 문구 -->
    <div class="sub-message">
      많은 관심과 이용 감사드립니다.<br>
      다음 판매 일정에 다시 찾아주세요.
    </div>

    <!-- 얇은 구분선 -->
    <div class="divider"></div>

    <!-- 환불 신청 버튼 -->
    <button class="btn-refund" onclick="location.href='#'">환불 신청</button>
  </div>

</body>
</html>
